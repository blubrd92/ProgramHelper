<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Library Program Sign-Ups</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/program.css">
  <link rel="stylesheet" href="css/slot-grid.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/reminders.css">
  <link rel="stylesheet" href="css/stats.css">
  <!-- The Firebase library is served from this site's own /vendor folder, not an outside CDN. -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "./vendor/firebase-app.js",
      "firebase/auth": "./vendor/firebase-auth.js",
      "firebase/firestore": "./vendor/firebase-firestore.js",
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js": "./vendor/firebase-app.js"
    }
  }
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/"><img src="logo.svg" alt="" width="30" height="30">Library Program Sign-Ups</a>
    <nav aria-label="Main">
      <a href="#/" data-nav="home">Programs</a>
      <a href="#/stats" data-nav="stats">Stats</a>
      <a href="#/templates" data-nav="templates" data-admin hidden>Templates</a>
      <a href="#/volunteers" data-nav="volunteers" data-admin hidden>Volunteers</a>
      <a href="#/settings" data-nav="settings" data-admin hidden>Settings</a>
    </nav>
    <div class="who">
      <span id="roleBadge" class="badge"></span>
      <button type="button" id="signOutBtn" class="btn btn-quiet">Sign out</button>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <p class="loading">Loading…</p>
  </main>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript>This tool needs JavaScript turned on.</noscript>
</body>
</html>
